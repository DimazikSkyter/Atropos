name: atropos-experiment

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
  KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
  KAFKA_LOG_RETENTION_HOURS: 2
  KAFKA_LOG_SEGMENT_BYTES: 16777216
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-kafka: &kafka
  image: atropos-experiment-kafka:local
  pull_policy: never
  cpus: 1.0
  mem_limit: 1g
  stop_grace_period: 15s
  healthcheck:
    test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 45s

x-app: &app
  image: atropos-experiment-app:local
  pull_policy: never
  cpus: 1.0
  mem_limit: 768m
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s

services:
  kafka1:
    <<: *kafka
    build: ./kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092
      LD_PRELOAD: /opt/disk-stall.so
    volumes:
      - kafka1:/var/lib/kafka/data
      - metadata1:/var/lib/kafka/metadata
      - faults:/faults
  kafka2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092
    volumes:
      - kafka2:/var/lib/kafka/data
      - metadata2:/var/lib/kafka/metadata
  kafka3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092
    volumes:
      - kafka3:/var/lib/kafka/data
      - metadata3:/var/lib/kafka/metadata
  kafka-init:
    image: atropos-experiment-kafka:local
    pull_policy: never
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:9092 --create --if-not-exists --topic entities --replica-assignment 1:2:3,2:3:1,3:1:2,1:3:2,2:1:3,3:2:1 --config min.insync.replicas=2
  postgres:
    image: postgres:17.5-alpine
    cpus: 1.0
    mem_limit: 768m
    environment:
      POSTGRES_DB: experiment
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
    command: [postgres, -c, max_connections=100, -c, shared_buffers=128MB]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U experiment -d experiment]
      interval: 3s
      timeout: 2s
      retries: 30
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    cpus: 1.0
    mem_limit: 256m
    command: [-host=0.0.0.0, -config=/config/proxies.json]
    ports: ['127.0.0.1:18674:8474']
    volumes: ['./toxiproxy.json:/config/proxies.json:ro']
    depends_on:
      postgres: {condition: service_healthy}
  consumer1:
    <<: *app
    environment:
      ROLE: consumer
      NODE: consumer1
      CPU_ITERATIONS: ${CPU_ITERATIONS:-12000}
      DATABASE_URL: postgresql://experiment:experiment@toxiproxy:15432/experiment
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      toxiproxy: {condition: service_started}
  consumer2:
    <<: *app
    environment:
      ROLE: consumer
      NODE: consumer2
      CPU_ITERATIONS: ${CPU_ITERATIONS:-12000}
      DATABASE_URL: postgresql://experiment:experiment@toxiproxy:25432/experiment
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      toxiproxy: {condition: service_started}
  api1:
    <<: *app
    build: ./app
    environment: {ROLE: api, NODE: api1, CPU_ITERATIONS: '${CPU_ITERATIONS:-12000}'}
    ports: ['127.0.0.1:18081:8000']
    depends_on:
      consumer1: {condition: service_healthy}
      consumer2: {condition: service_healthy}
  api2:
    <<: *app
    environment: {ROLE: api, NODE: api2, CPU_ITERATIONS: '${CPU_ITERATIONS:-12000}'}
    ports: ['127.0.0.1:18082:8000']
    depends_on:
      consumer1: {condition: service_healthy}
      consumer2: {condition: service_healthy}
  observer:
    build: ./observer
    cpus: 1.0
    mem_limit: 256m
    ports: ['127.0.0.1:18099:8099']
    volumes: ['faults:/faults']
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    cpus: 1.0
    mem_limit: 768m
    command: [-storageDataPath=/data, -retentionPeriod=7d, -promscrape.config=/config/scrape.yml, -search.latencyOffset=1s]
    ports: ['127.0.0.1:18428:8428']
    volumes: ['metrics:/data', './monitoring/scrape.yml:/config/scrape.yml:ro']
  grafana:
    image: grafana/grafana:12.4.0
    cpus: 1.0
    mem_limit: 512m
    ports: ['127.0.0.1:13001:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: experiment
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/experiment.json:ro
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    cpus: 1.0
    mem_limit: 384m
    privileged: true
    command: [--docker_only=true, --housekeeping_interval=2s]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
  k6:
    image: grafana/k6:1.0.0
    cpus: 1.0
    mem_limit: 4g
    profiles: [load]
    volumes: ['./load:/scripts:ro']
    entrypoint: [k6]
    command: [run, /scripts/test.js]

volumes:
  kafka1:
  kafka2:
  kafka3:
  metadata1:
  metadata2:
  metadata3:
  postgres:
  faults:
  metrics:
  grafana:
