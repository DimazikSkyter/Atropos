name: atropos-service

x-runtime-environment: &runtime-environment
  PGHOST: config-postgres
  PGPORT: "5432"
  PGDATABASE: ${ATROPOS_CONFIG_DB:-atropos_config}
  PGUSER: ${ATROPOS_CONFIG_USER:-atropos}
  PGPASSWORD: ${ATROPOS_CONFIG_PASSWORD:-atropos-local-config}
  ATROPOS_RUNTIME_TOKEN_FILE: /run/secrets/runtime_token
  ATROPOS_SOURCE_LOOPBACK_HOST: host.docker.internal
  ATROPOS_UI_DEMO: "0"

services:
  config-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ATROPOS_CONFIG_DB:-atropos_config}
      POSTGRES_USER: ${ATROPOS_CONFIG_USER:-atropos}
      POSTGRES_PASSWORD: ${ATROPOS_CONFIG_PASSWORD:-atropos-local-config}
    ports:
      - "127.0.0.1:${ATROPOS_CONFIG_PORT:-55432}:5432"
    volumes:
      - config_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  config-migrate:
    image: postgres:17-alpine
    depends_on:
      config-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${ATROPOS_CONFIG_PASSWORD:-atropos-local-config}
      PGHOST: config-postgres
      PGUSER: ${ATROPOS_CONFIG_USER:-atropos}
      PGDATABASE: ${ATROPOS_CONFIG_DB:-atropos_config}
    volumes:
      - ../detectors/apps/services/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for migration in /migrations/[0-9]*.sql; do
          psql --set=ON_ERROR_STOP=1 --file="$$migration"
        done
    restart: "no"

  server:
    image: atropos-runtime:local
    build:
      context: ..
      dockerfile: infra/service/Dockerfile
      target: server
    init: true
    environment: *runtime-environment
    env_file:
      - path: ./runtime.env
        required: false
        format: raw
    secrets:
      - runtime_token
    depends_on:
      config-postgres:
        condition: service_healthy
      config-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ATROPOS_SERVER_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${ATROPOS_SERVER_MEMORY:-2g}
    stop_grace_period: 2m
    restart: unless-stopped

  ui:
    image: atropos-ui:local
    build:
      context: ..
      dockerfile: infra/service/Dockerfile
      target: ui
    init: true
    environment:
      <<: *runtime-environment
      ATROPOS_RUNTIME_URL: http://server:8000
    env_file:
      - path: ./runtime.env
        required: false
        format: raw
    secrets:
      - runtime_token
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ATROPOS_UI_PORT:-8501}:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${ATROPOS_UI_MEMORY:-1g}
    restart: unless-stopped

volumes:
  config_postgres_data:

secrets:
  runtime_token:
    file: ./service/.runtime/token
