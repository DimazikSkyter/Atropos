apiVersion: 1

datasources:
  - name: InfluxDB Replay
    uid: influxdb-replay
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
      httpMode: POST
      timeInterval: 15s
    secureJsonData:
      token: $INFLUXDB_TOKEN
