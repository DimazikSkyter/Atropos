name: atropos-experiment2

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 1000
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_LOG_RETENTION_HOURS: 2
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m

x-kafka: &kafka
  image: apache/kafka:4.0.1
  cpus: 1.0
  mem_limit: 768m
  healthcheck:
    test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 40s

x-app: &app
  image: atropos-experiment2-app:local
  build: ./app
  cpus: 1.0
  mem_limit: 640m
  depends_on:
    kafka-init: {condition: service_completed_successfully}
    postgres: {condition: service_healthy}

services:
  kafka1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092
    volumes: [kafka1:/var/lib/kafka/data]
  kafka2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092
    volumes: [kafka2:/var/lib/kafka/data]
  kafka3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092
    volumes: [kafka3:/var/lib/kafka/data]
  kafka-init:
    image: apache/kafka:4.0.1
    cpus: 1.0
    mem_limit: 384m
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command: ['/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:9092 --create --if-not-exists --topic cache-requests --partitions 2 --replication-factor 3 --config min.insync.replicas=2']
  postgres:
    image: postgres:17.5-alpine
    cpus: 1.0
    mem_limit: 512m
    environment: {POSTGRES_DB: experiment2, POSTGRES_USER: lab, POSTGRES_PASSWORD: lab}
    volumes: [postgres:/var/lib/postgresql/data, './postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lab -d experiment2']
      interval: 3s
      timeout: 3s
      retries: 30
  api1:
    <<: *app
    environment: {ROLE: api, NODE: api1}
    ports: ['127.0.0.1:18181:8080']
  api2:
    <<: *app
    environment: {ROLE: api, NODE: api2}
    ports: ['127.0.0.1:18182:8080']
  consumer1:
    <<: *app
    environment: {ROLE: consumer, NODE: consumer1, CACHE_SIZE: '256', DB_WORK: '${DB_WORK:-2000}'}
    ports: ['127.0.0.1:18183:8080']
  consumer2:
    <<: *app
    environment: {ROLE: consumer, NODE: consumer2, CACHE_SIZE: '256', DB_WORK: '${DB_WORK:-2000}'}
    ports: ['127.0.0.1:18184:8080']
  k6:
    image: grafana/k6:1.0.0
    cpus: 1.0
    mem_limit: 512m
    profiles: [load]
    user: '0:0'
    volumes: ['./load:/scripts:ro']
    entrypoint: [k6, run, /scripts/test.js]

volumes:
  kafka1:
  kafka2:
  kafka3:
  postgres:
