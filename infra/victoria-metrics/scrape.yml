global:
  scrape_interval: 5s

scrape_configs:
  - job_name: purchase-producer
    static_configs:
      - targets:
          - host.docker.internal:8001

  - job_name: purchase-consumer
    static_configs:
      - targets:
          - host.docker.internal:8002

  # windows_exporter must run on the Windows host. Its official container image
  # cannot run alongside this Linux-container stack in Docker Desktop.
  - job_name: windows-exporter
    static_configs:
      - targets:
          - host.docker.internal:9182

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: {node: docker-linux-vm}
  - job_name: experiment2
    scrape_interval: 2s
    static_configs:
      - targets: [host.docker.internal:18181, host.docker.internal:18182, host.docker.internal:18183, host.docker.internal:18184]

  - job_name: experiment3
    scrape_interval: 2s
    static_configs:
      - targets: [host.docker.internal:18281, host.docker.internal:18282]

  - job_name: experiment4
    scrape_interval: 2s
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:18381]
        labels:
          experiment: experiment4
