[project]
name = "atropos-ui"
version = "0.1.0"
description = "Streamlit console for Atropos metrics"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.45,<2",
    "plotly>=6,<7",
    "pandas>=2.2,<3",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "numpy>=2,<3",
    "scipy>=1.13,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atropos_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
