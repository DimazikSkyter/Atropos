[project]
name = "atropos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6.0,<4",
    "prometheus-client>=0.21.0,<1",
    "psycopg[binary]>=3.2.0,<4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research*"]
